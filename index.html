<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <title>Petits Plats</title>    
</head>
<body>
    <header>
        <div class="banner container-fluid h-100">
            <img src="/assets/images/logo.svg" alt="logo les petits plats" class="logo col-2 fixed-top">
            <div class="container-fluid h-100 d-flex flex-column justify-content-center">            
                <h2 class="searchTitle mx-auto">cherchez parmi plus de 1500 recettes<br>
                    du quotidien, simples et délicieuses</h2>                
                <form action="" class="d-flex mx-auto justify-content-center" onsubmit="event.preventDefault();">
                    <input type="text" id="searchBar" name="searchBar" class="d-flex searchBar p-2" placeholder="Rechercher une recette, un ingrédient, ..." onkeyup="validInput(event)">
                    <button type="submit" class="searchBtn btn btn-dark">
                        <div class="mglass">
                            <div class="round"></div>
                            <div class="line"></div>
                        </div>
                    </button>
                </form>  
            </div>    
        </div>
                
    </header>
    <div class="main">
        <div class="selectContainer d-flex justify-content-center">            
            <div class="ingredientsContainer container mt-3">
                <div class="input-group">
                    <input type="text" class="form-control" id="searchIngredients" placeholder="">
                </div>
                <select id="ingredientsSelect" class="form-control">
                    <!-- <option value="">ingrédients</option> -->
                </select>
            
                <ul class="list-group mt-3" id="ingredientsList">
                    
                </ul>
            </div>
            <div class="applianceContainer container mt-3">
                <div class="input-group">
                    <input type="text" class="form-control" id="searchAppliance" placeholder="">
                </div>
                <select id="applianceSelect" class="form-control">
                    <!-- <option value="">Appareils</option> -->
                </select>
            
                <ul class="list-group mt-3" id="applianceList">
                    
                </ul>
            </div>
            <div class="utensilsContainer container mt-3">
                <div class="input-group">
                    <input type="text" class="form-control" id="searchUtensils" placeholder="">
                </div>
                <select id="utensilsSelect" class="form-control">
                    <!-- <option value="">Ustensiles</option> -->
                </select>
            
                <ul class="list-group mt-3" id="utensilsList">
                    
                </ul>
            </div>
            <h3 class="recipesCounter"></h3>
        </div>
        <div class="recipes">
            <ul id="recipesList"></ul>
        </div>
        <div class="cardsGrid">
            <div class="cardRow row"></div>
            <div class="card">
                <img src="/assets/images/Recette01.jpg" class="recipeImg card-img-top" alt="">
                <div class="recipeCardBody card-body">
                  <h4 class="recipeTitle card-title">Limonade de Coco</h4>
                  <h5>recette</h5>
                  <p class="recipe card-text">
                    Mettre les glaçons à votre goût dans le blender, ajouter le lait, la crème de coco, le jus de 2 citrons et le sucre. Mixer jusqu'à avoir la consistence désirée",
                  </p>
                  <h5>ingrédients</h5>
                  <ul class="ingredientsList">
                    <li class="recipeIngredient">
                        <h6 class="ingredient"></h6>
                        <p class="quantity"></p>
                    </li>
                    <li class="recipeIngredient">
                        <h6 class="ingredient"></h6>
                        <p class="quantity"></p>
                    </li>
                    <li class="recipeIngredient">
                        <h6 class="ingredient"></h6>
                        <p class="quantity"></p>
                    </li> 
                  </ul>
                </div>                
            </div>
        </div>
    </div>
    <!-- Chargement des scripts -->
    <script src="scripts/recipes.js"></script>
    <script src="scripts/search.js"></script>
    <script src="scripts/dropdown.js"></script>
</body>
</html>
